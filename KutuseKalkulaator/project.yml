name: KutuseKalkulaator
options:
  bundleIdPrefix: ee.kutuse
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  KutuseKalkulaator:
    type: application
    platform: macOS
    sources:
      - path: KutuseKalkulaator
        excludes:
          - "Assets.xcassets"
    resources:
      - path: KutuseKalkulaator/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ee.kutuse.KutuseKalkulaator
        INFOPLIST_FILE: KutuseKalkulaator/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: KutuseKalkulaator/KutuseKalkulaator.entitlements
